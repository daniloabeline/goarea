# MySQL NDB Cluster Configuration
# Arquivo: config.ini
# Localização: /var/lib/mysql-cluster/config.ini

[ndbd default]
# Configurações padrão para todos os data nodes
NoOfReplicas=2                    # Número de réplicas (recomendado: 2)
DataMemory=512M                   # Memória para dados (ajustar conforme RAM disponível)
IndexMemory=128M                  # Memória para índices
MaxNoOfAttributes=1000            # Máximo de atributos por tabela
MaxNoOfTables=128                 # Máximo de tabelas
MaxNoOfOrderedIndexes=128         # Máximo de índices ordenados
MaxNoOfUniqueHashIndexes=128      # Máximo de índices únicos
MaxNoOfTriggers=768               # Máximo de triggers
MaxNoOfConcurrentOperations=10000 # Máximo de operações concorrentes
MaxNoOfConcurrentTransactions=4096 # Máximo de transações concorrentes
FragmentLogFileSize=16M           # Tamanho do arquivo de log de fragmento
NoOfFragmentLogFiles=16           # Número de arquivos de log de fragmento
MaxNoOfExecutionThreads=2         # Número de threads de execução
LockPagesInMainMemory=1           # Bloquear páginas na memória principal
StopOnError=1                     # Parar em caso de erro
Diskless=0                        # Usar disco (0) ou apenas memória (1)
ArbitrationDelay=0                # Delay para arbitragem
MemReportFrequency=30             # Frequência de relatório de memória
BackupDataBufferSize=2M           # Tamanho do buffer de backup de dados
BackupLogBufferSize=2M            # Tamanho do buffer de backup de log
BackupMemory=64M                  # Memória total para backup
BackupWriteSize=32K               # Tamanho de escrita de backup
BackupMaxWriteSize=256K           # Tamanho máximo de escrita de backup
BackupDataDir=/var/lib/mysql-cluster/backup # Diretório de backup
BackupLogDir=/var/lib/mysql-cluster/backup  # Diretório de log de backup

[ndb_mgmd]
# Management Node - Gerencia o cluster
NodeId=1
HostName=mgmt-server.example.com
DataDir=/var/lib/mysql-cluster
PortNumber=1186
LogDestination=FILE:filename=/var/lib/mysql-cluster/ndb_1_cluster.log
MaxNoOfStartedNodes=16
MaxNoOfConcurrentNodeFailures=1
HeartbeatIntervalDbDb=1500
HeartbeatIntervalDbApi=1500
ArbitrationTimeout=5000
ConnectBackoffMaxDelay=100
ConnectBackoffInitialDelay=1000
ConnectBackoffIncreaseDelay=1000
ConnectBackoffMaxDelay=10000
ConnectBackoffResetDelay=10000

[ndbd]
# Data Node 1 - Armazena os dados
NodeId=2
HostName=data1-server.example.com
DataDir=/var/lib/mysql-cluster
BackupDataDir=/var/lib/mysql-cluster/backup
BackupLogDir=/var/lib/mysql-cluster/backup
FileSystemPath=/var/lib/mysql-cluster
MaxNoOfAttributes=1000
MaxNoOfTables=128
MaxNoOfOrderedIndexes=128
MaxNoOfUniqueHashIndexes=128
MaxNoOfTriggers=768
MaxNoOfConcurrentOperations=10000
MaxNoOfConcurrentTransactions=4096
FragmentLogFileSize=16M
NoOfFragmentLogFiles=16
MaxNoOfExecutionThreads=2
LockPagesInMainMemory=1
StopOnError=1
Diskless=0
ArbitrationDelay=0
MemReportFrequency=30
BackupDataBufferSize=2M
BackupLogBufferSize=2M
BackupMemory=64M
BackupWriteSize=32K
BackupMaxWriteSize=256K

[ndbd]
# Data Node 2 - Réplica dos dados
NodeId=3
HostName=data2-server.example.com
DataDir=/var/lib/mysql-cluster
BackupDataDir=/var/lib/mysql-cluster/backup
BackupLogDir=/var/lib/mysql-cluster/backup
FileSystemPath=/var/lib/mysql-cluster
MaxNoOfAttributes=1000
MaxNoOfTables=128
MaxNoOfOrderedIndexes=128
MaxNoOfUniqueHashIndexes=128
MaxNoOfTriggers=768
MaxNoOfConcurrentOperations=10000
MaxNoOfConcurrentTransactions=4096
FragmentLogFileSize=16M
NoOfFragmentLogFiles=16
MaxNoOfExecutionThreads=2
LockPagesInMainMemory=1
StopOnError=1
Diskless=0
ArbitrationDelay=0
MemReportFrequency=30
BackupDataBufferSize=2M
BackupLogBufferSize=2M
BackupMemory=64M
BackupWriteSize=32K
BackupMaxWriteSize=256K

[mysqld]
# SQL Node 1 - Interface SQL para aplicações
NodeId=4
HostName=sql1-server.example.com
PortNumber=3306

[mysqld]
# SQL Node 2 - Interface SQL para aplicações
NodeId=5
HostName=sql2-server.example.com
PortNumber=3306

[mysqld]
# SQL Node 3 - Interface SQL para aplicações (opcional)
NodeId=6
HostName=sql3-server.example.com
PortNumber=3306

[api]
# API Node - Conecta aplicações diretamente ao cluster
NodeId=7
HostName=api1-server.example.com

[api]
# API Node - Conecta aplicações diretamente ao cluster
NodeId=8
HostName=api2-server.example.com